<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>에디터 열기</title>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px;">
  <p>에디터를 작은 창으로 실행합니다...</p>
  <button onclick="launchPopup()" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">
    작은 창 다시 띄우기
  </button>

  <script>
    function launchPopup() {
      const width = 520;
      const height = 740;
      // 화면 우측 상단 쪽에 적당히 붙도록 위치 계산
      const left = window.screen.availWidth - width - 40;
      const top = 60;
      
      const features = `width=${width},height=${height},left=${left},top=${top},menubar=no,toolbar=no,location=no,status=no,resizable=yes,scrollbars=yes`;
      
      const win = window.open('editor.html', 'PlainTextEditorPopup', features);
      if (win) {
        // 팝업이 정상적으로 열리면 런처 탭은 깔끔하게 닫기 시도
        setTimeout(() => window.close(), 300);
      }
    }

    // 파일 열자마자 바로 팝업 실행
    window.onload = launchPopup;
  </script>
</body>
</html>
